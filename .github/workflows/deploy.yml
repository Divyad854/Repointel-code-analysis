
name: Repo-Intel CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/repo-intel/Repointel-code-analysis

            echo "Fetching latest code..."
            git fetch origin main
            git pull --ff-only origin main

            echo "Checking latest commit..."
            git log -1 --oneline

            echo "Building Docker images..."
            docker compose build --pull web ai_service

            echo "Applying migrations..."
            docker compose run --rm --no-deps web python manage.py migrate

            echo "Restarting containers..."
            docker compose up -d --no-deps --force-recreate web ai_service

            echo "Checking containers..."
            docker compose ps

            echo "Deployment completed successfully!"
