services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repointel}
      POSTGRES_USER: ${POSTGRES_USER:-repointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repointel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai_service:
    build: ./ai_service
    env_file: .env
    environment:
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma:/data/chroma
    ports:
      - "8001:8001"   # FastAPI docs at http://localhost:8001/docs

  web:
    build: ./web
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-repointel}
      POSTGRES_USER: ${POSTGRES_USER:-repointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repointel}
      AI_SERVICE_URL: http://ai_service:8001
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  pgdata:
  chroma:
